server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache headers
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fall back to index.html for all other routes so that
    # react-router-dom can handle client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
